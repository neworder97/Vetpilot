# Prepared only: move to .github/workflows/ after review to enable manual validation.
name: VetPilot Safety Validation (No Release)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios-end-to-end:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: brew install xcodegen
      - name: Real simulator unit and UI tests
        run: bash ValidationPrepared/run_ios_validation.sh
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VetPilot-Safety-Simulator-Evidence
          path: ValidationResults/
          if-no-files-found: warn
