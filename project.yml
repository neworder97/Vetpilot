name: FergusonVetPilot
options:
  bundleIdPrefix: com.ferguson
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 0.8.5
    CURRENT_PROJECT_VERSION: 18

targets:
  FergusonVetPilot:
    type: application
    platform: iOS
    sources:
      - path: FergusonVetPilot
    preBuildScripts:
      - name: Generate App Icon
        script: python3 "$SRCROOT/Scripts/generate_app_icon.py"
        basedOnDependencyAnalysis: false
    info:
      path: FergusonVetPilot/Info.plist
      properties:
        CFBundleDisplayName: VetPilot
        CFBundleName: VetPilot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        UIUserInterfaceStyle: Light
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.ferguson.vetpilot.collection-refresh]
        UILaunchScreen: {}
        NSCameraUsageDescription: VetPilot uses the camera for clinic reference photos.
        NSPhotoLibraryUsageDescription: VetPilot imports reference photos for your clinic protocols.
        CFBundleURLTypes:
          - CFBundleURLName: com.ferguson.vetpilot.auth
            CFBundleURLSchemes: [vetpilot]
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: VetPilot clinic protocol
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.ferguson.vetpilot.protocol]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.ferguson.vetpilot.protocol
            UTTypeDescription: VetPilot editable clinic protocol
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [vetpilot]
              public.mime-type: application/vnd.vetpilot.protocol+json
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ferguson.vetpilot
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"

  FergusonVetPilotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FergusonVetPilotTests
    dependencies:
      - target: FergusonVetPilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ferguson.vetpilot.tests

  FergusonVetPilotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FergusonVetPilotUITests
    dependencies:
      - target: FergusonVetPilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ferguson.vetpilot.uitests

schemes:
  FergusonVetPilot:
    build:
      targets:
        FergusonVetPilot: all
        FergusonVetPilotTests: [test]
        FergusonVetPilotUITests: [test]
    test:
      targets:
        - FergusonVetPilotTests
        - FergusonVetPilotUITests
