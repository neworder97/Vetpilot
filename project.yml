name: FergusonVetPilot
options:
  bundleIdPrefix: com.ferguson
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 0.4.2
    CURRENT_PROJECT_VERSION: 6

targets:
  FergusonVetPilot:
    type: application
    platform: iOS
    sources:
      - path: FergusonVetPilot
    preBuildScripts:
      - name: Generate App Icon
        script: python3 "$SRCROOT/Scripts/generate_app_icon.py"
        basedOnDependencyAnalysis: false
    info:
      path: FergusonVetPilot/Info.plist
      properties:
        CFBundleDisplayName: VetPilot
        CFBundleName: VetPilot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        UIUserInterfaceStyle: Light
        UILaunchScreen: {}
        NSCameraUsageDescription: VetPilot uses the camera to capture veterinary radiographs for clinical review.
        NSPhotoLibraryUsageDescription: VetPilot uses your photo library to import veterinary radiographs for clinical review.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ferguson.vetpilot
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"

  FergusonVetPilotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FergusonVetPilotTests
    dependencies:
      - target: FergusonVetPilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ferguson.vetpilot.tests

  FergusonVetPilotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FergusonVetPilotUITests
    dependencies:
      - target: FergusonVetPilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ferguson.vetpilot.uitests

schemes:
  FergusonVetPilot:
    build:
      targets:
        FergusonVetPilot: all
        FergusonVetPilotTests: [test]
        FergusonVetPilotUITests: [test]
    test:
      targets:
        - FergusonVetPilotTests
        - FergusonVetPilotUITests

