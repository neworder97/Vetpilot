name: VetPilot Additive Import and Build

on:
  push:
    branches: [vetpilot-additive-migration]
    paths:
      - 'VetPilot-Migration-Additive.zip'
      - '.github/workflows/import-vetpilot.yml'
      - 'FergusonVetPilot/**'
      - 'FergusonVetPilotTests/**'
      - 'FergusonVetPilotUITests/**'
      - 'PreservedOriginalBundleResources/**'
      - 'Scripts/**'
      - 'project.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vetpilot-additive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import-project:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.import.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vetpilot-additive-migration
          fetch-depth: 0
      - name: Verify and import the saved source snapshot
        id: import
        shell: bash
        run: |
          set -euo pipefail
          ZIP=VetPilot-Migration-Additive.zip
          if [[ -f "$ZIP" && ! -f FergusonVetPilot/ContentView.swift ]]; then
            echo "054407c2d874d651b2476fa6abd3dad2623f1d96e1909fbcec2fc3f96b14199c  $ZIP" | sha256sum -c -
            unzip -tq "$ZIP"
            mkdir -p .migration_tmp
            unzip -q "$ZIP" -d .migration_tmp
            # Import app/source/resources only. Do not let the archive replace
            # the active workflow or ask GITHUB_TOKEN to create workflows.
            rsync -a --exclude '.git' --exclude '.github' .migration_tmp/ ./
            rm -rf .migration_tmp
            test -f FergusonVetPilot/ContentView.swift
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Import complete VetPilot source and original visual resources"
              git push origin HEAD:vetpilot-additive-migration
            fi
          fi
          test -f FergusonVetPilot/ContentView.swift
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  validate-and-build:
    needs: import-project
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.import-project.outputs.source_sha }}
          persist-credentials: false
      - name: Record exact source revision
        run: git rev-parse HEAD | tee SOURCE_COMMIT.txt
      - name: Run medication audit
        run: python3 Scripts/second_audit.py .
      - name: Run administration and breed audit
        run: python3 Scripts/administration_audit.py .
      - name: Run dog/cat nutrition audit
        run: python3 Scripts/nutrition_audit.py .
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Run Swift unit tests
        run: |
          set -o pipefail
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(device["udid"] for devices in d.values() for device in devices if device.get("isAvailable") and "iPhone" in device.get("name", "")))')
          test -n "$SIMULATOR_ID"
          xcodebuild test -project FergusonVetPilot.xcodeproj -scheme FergusonVetPilot -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -only-testing:FergusonVetPilotTests CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild-test.log
      - name: Build unsigned physical-device app
        run: |
          set -o pipefail
          xcodebuild build -project FergusonVetPilot.xcodeproj -scheme FergusonVetPilot -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath .build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' 2>&1 | tee xcodebuild-device.log
      - name: Restore and verify exact original resources
        run: |
          set -euo pipefail
          APP=$(find .build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          bash Scripts/restore_original_bundle_resources.sh "$APP"
          echo "e27206e6873e9963dee4aa20ef1f62c9d65244d458bd943fe89c5ace1e78e1e6  $APP/Assets.car" | shasum -a 256 -c -
          echo "be63d533d0079eda983e5bbf60e83a9a98e2565801de04cfb8e11231f01a23c4  $APP/AppIcon60x60@2x.png" | shasum -a 256 -c -
          echo "915756e6e268af12407a534c8a401b1bd52459874b9ddefa2fae1e2500be75cb  $APP/AppIcon76x76@2x~ipad.png" | shasum -a 256 -c -
          echo "2a5fff582473af14a34ad8d421208cb3ae3f800e12844f8b6ae3bf8cab0ba53e  $APP/VetPilotLogoSource.jpg" | shasum -a 256 -c -
      - name: Package unsigned IPA and verify size without padding
        run: |
          set -euo pipefail
          APP=$(find .build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          rm -rf Payload FergusonVetPilot-Signulous-Unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry FergusonVetPilot-Signulous-Unsigned.ipa Payload
          unzip -tq FergusonVetPilot-Signulous-Unsigned.ipa
          BYTES=$(stat -f%z FergusonVetPilot-Signulous-Unsigned.ipa)
          echo "Final IPA bytes: $BYTES" | tee IPA_SIZE.txt
          shasum -a 256 FergusonVetPilot-Signulous-Unsigned.ipa | tee IPA_SHA256.txt
          test "$BYTES" -gt 1989495
      - name: Upload new unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: FergusonVetPilot-OriginalPlus-AllUpgrades-Unsigned
          path: FergusonVetPilot-Signulous-Unsigned.ipa
          if-no-files-found: error
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VetPilot-validation-evidence
          path: |
            *AUDIT*.json
            SOURCE_COMMIT.txt
            IPA_SIZE.txt
            IPA_SHA256.txt
            xcodebuild-test.log
            xcodebuild-device.log
          if-no-files-found: warn
