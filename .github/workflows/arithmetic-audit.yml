name: VetPilot Independent Arithmetic Audit
on:
  push:
    branches: [vetpilot-safety-labwork]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arithmetic:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 ValidationArithmetic/run_local_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VetPilot-Arithmetic-Evidence
          path: |
            ValidationArithmetic/*.json
            ValidationArithmetic/*.csv
            ValidationArithmetic/evidence/
